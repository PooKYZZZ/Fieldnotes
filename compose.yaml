name: devops-learning-platform

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${FIELDNOTES_SOURCE_REVISION:-uncommitted}
    image: devops-fieldnotes:local
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/lms.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${FIELDNOTES_PROD_BETTER_AUTH_SECRET:?Set FIELDNOTES_PROD_BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${FIELDNOTES_PUBLIC_URL:-https://learn.cybertracesystems.com}
      FIELDNOTES_PUBLIC_URL: ${FIELDNOTES_PUBLIC_URL:-https://learn.cybertracesystems.com}
      FIELDNOTES_OWNER_EMAIL: ${FIELDNOTES_OWNER_EMAIL:?Set FIELDNOTES_OWNER_EMAIL before enabling accounts}
      GOOGLE_CLIENT_ID: ${FIELDNOTES_PROD_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${FIELDNOTES_PROD_GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${FIELDNOTES_PROD_GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${FIELDNOTES_PROD_GITHUB_CLIENT_SECRET:-}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - learning-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  learning-data:
