<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Reduce exposure and privilege</title>
  <desc id="desc">An inventory informs multiple complementary actions that reduce attack surface and blast radius.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#39776f"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c7d9b"/></marker></defs>
  <rect width="960" height="420" rx="20" fill="#f4f8f6"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#29494a">Reduce exposure and privilege</text>
  <path d="M250 201 L365 121" fill="none" stroke="#4c7d9b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <path d="M250 201 L365 281" fill="none" stroke="#4c7d9b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <path d="M615 121 L710 201" fill="none" stroke="#39776f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M615 281 L710 201" fill="none" stroke="#39776f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="155" width="210" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="145" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="145" dy="0">Inventory</tspan>
  </text>
  <text x="145" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">ports, accounts, data</text>
  <rect x="365" y="75" width="250" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="490" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="490" dy="0">Restrict access</tspan>
  </text>
  <text x="490" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">unneeded listeners + rights</text>
  <rect x="365" y="235" width="250" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="490" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="490" dy="0">Patch and remove</tspan>
  </text>
  <text x="490" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">supported packages + unused services</text>
  <rect x="710" y="155" width="210" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="815" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="815" dy="0">Lower exposure</tspan>
  </text>
  <text x="815" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">verify each path</text>
  <text x="32" y="392" font-family="Arial,sans-serif" font-size="14" fill="#41595f">Restricting access and patching are parallel controls chosen from the inventory.</text>
  </svg>