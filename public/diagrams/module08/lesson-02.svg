<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Containers and process lifecycle</title><desc id="desc">A container starts a process from an image; its exit status and restart policy govern lifecycle behavior.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#377d76"/></marker></defs><rect width="960" height="360" rx="24" fill="#f3f7f6"/><text x="48" y="54" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193b3b">Containers and process lifecycle</text><rect x="50" y="108" width="250" height="150" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><text x="70" y="139" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#377d76">STEP 1</text><text x="70" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Image command</text><text x="70" y="204" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Defines the process to start</text><path d="M308 184H345" stroke="#377d76" stroke-width="4" marker-end="url(#arrow)"/><text x="326" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#42605c">then</text><rect x="355" y="108" width="250" height="150" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><text x="375" y="139" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#377d76">STEP 2</text><text x="375" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Container process</text><text x="375" y="204" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Runs with container boundaries</text><path d="M613 184H650" stroke="#377d76" stroke-width="4" marker-end="url(#arrow)"/><text x="631" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#42605c">then</text><rect x="660" y="108" width="250" height="150" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><text x="680" y="139" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#377d76">STEP 3</text><text x="680" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Exit behavior</text><text x="680" y="204" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Status and restart policy</text><text x="480" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#42605c">A container runs an image command, exits with a status, and may be restarted according to its</text><text x="480" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#42605c">policy.</text></svg>