<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Checks and artifacts</title>
<desc id="desc">Tests, lint and types, integration checks, and container builds are separate check types whose results are associated with the tested revision.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Checks and artifacts</text>
<path d="M125 207 L800 246" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M330 207 L800 246" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M535 207 L800 246" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M740 207 L800 246" fill="none" stroke="#6586a3" stroke-width="3"/>
<rect x="40" y="145" width="170" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="125.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="125.0" dy="0">Tests</tspan></text>
<rect x="245" y="145" width="170" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="330.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="330.0" dy="0">Lint and types</tspan></text>
<rect x="450" y="145" width="170" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="535.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="535.0" dy="0">Integration checks</tspan></text>
<rect x="655" y="145" width="170" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="740.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="740.0" dy="0">Container build</tspan></text>
<rect x="770" y="255" width="160" height="58" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="850.0" y="280.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="850.0" dy="0">Report tied to</tspan><tspan x="850.0" dy="17">revision</tspan></text>
<text x="42" y="92" fill="#526579" font-family="Arial,sans-serif" font-size="14">Independent checks, not a required sequence</text>
</svg>