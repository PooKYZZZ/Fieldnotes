<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Permissions and trust boundaries</title>
<desc id="desc">Untrusted pull-request checks use limited permissions without deployment secrets. A separate protected, reviewed path can use narrowly scoped deployment authority.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Permissions and trust boundaries</text>
<path d="M288 145 L352 145" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 145 L664 145" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M288 255 L352 255" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 255 L664 255" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="115" width="240" height="60" rx="14" fill="#f4e0df" stroke="#7794ad" stroke-width="2"/>
<text x="168.0" y="141.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="168.0" dy="0">External pull</tspan><tspan x="168.0" dy="17">request code</tspan></text>
<rect x="360" y="115" width="240" height="60" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="480.0" y="141.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="480.0" dy="0">Read-only checks, no</tspan><tspan x="480.0" dy="17">secrets</tspan></text>
<rect x="672" y="115" width="240" height="60" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="792.0" y="150.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="792.0" dy="0">Check result</tspan></text>
<rect x="48" y="225" width="240" height="60" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="168.0" y="251.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="168.0" dy="0">Trusted protected</tspan><tspan x="168.0" dy="17">revision</tspan></text>
<rect x="360" y="225" width="240" height="60" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="480.0" y="251.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="480.0" dy="0">Review and</tspan><tspan x="480.0" dy="17">deployment gate</tspan></text>
<rect x="672" y="225" width="240" height="60" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="792.0" y="251.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="792.0" dy="0">Scoped deployment</tspan><tspan x="792.0" dy="17">authority</tspan></text>
<text x="50" y="95" fill="#526579" font-family="Arial,sans-serif" font-size="14">Untrusted check path</text>
<text x="50" y="207" fill="#526579" font-family="Arial,sans-serif" font-size="14">Protected deployment path</text>
</svg>