<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Python for structured operations</title><desc id="desc">Python can parse structured input, validate its shape, and produce an operation result while handling errors.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#377d76"/></marker></defs><rect width="960" height="360" rx="24" fill="#f3f7f6"/><text x="48" y="54" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193b3b">Python for structured operations</text><rect x="50" y="108" width="250" height="150" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><text x="70" y="139" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#377d76">STEP 1</text><text x="70" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Input data</text><text x="70" y="204" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Parse structured values</text><path d="M308 184H345" stroke="#377d76" stroke-width="4" marker-end="url(#arrow)"/><text x="326" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#42605c">then</text><rect x="355" y="108" width="250" height="150" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><text x="375" y="139" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#377d76">STEP 2</text><text x="375" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Validation</text><text x="375" y="204" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Check shape and required fields</text><path d="M613 184H650" stroke="#377d76" stroke-width="4" marker-end="url(#arrow)"/><text x="631" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#42605c">then</text><rect x="660" y="108" width="250" height="150" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><text x="680" y="139" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#377d76">STEP 3</text><text x="680" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Operation result</text><text x="680" y="204" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Handle errors and report output</text><text x="480" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#42605c">A structured operation parses input, validates it, and produces an output with errors handled.</text></svg>