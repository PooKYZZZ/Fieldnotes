<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Addresses, subnets, and routes</title><desc id="desc">An address belongs to a network prefix; routing selects a next hop for traffic to a destination.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#377d76"/></marker></defs><rect width="960" height="360" rx="24" fill="#f3f7f6"/><text x="48" y="54" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193b3b">Addresses, subnets, and routes</text><rect x="62" y="123" width="250" height="126" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><circle cx="93" cy="154" r="16" fill="#d6eee8"/><text x="93" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#193b3b">1</text><text x="187" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Host address</text><path d="M320 186H348" stroke="#377d76" stroke-width="4" marker-end="url(#arrow)"/><rect x="354" y="123" width="250" height="126" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><circle cx="385" cy="154" r="16" fill="#d6eee8"/><text x="385" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#193b3b">2</text><text x="479" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Subnet decision</text><path d="M612 186H640" stroke="#377d76" stroke-width="4" marker-end="url(#arrow)"/><rect x="646" y="123" width="250" height="126" rx="16" fill="#fff" stroke="#377d76" stroke-width="3"/><circle cx="677" cy="154" r="16" fill="#d6eee8"/><text x="677" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#193b3b">3</text><text x="771" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#193b3b">Selected route</text><text x="480" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42605c">Follow the evidence across each boundary; verify before changing state.</text></svg>