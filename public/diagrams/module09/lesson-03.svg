<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Configuration and persistent state</title>
<desc id="desc">Nonsecret defaults and protected secrets are separate configuration inputs to the application. Database files persist in a named volume with a tested backup and restore path.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Configuration and persistent state</text>
<path d="M280 126 L357 166" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M280 221 L357 186" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M782 157 L782 207" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="95" width="230" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="165.0" y="122.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="165.0" dy="0">Versioned nonsecret</tspan><tspan x="165.0" dy="17">defaults</tspan></text>
<rect x="50" y="190" width="230" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="165.0" y="217.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="165.0" dy="0">Protected secret</tspan><tspan x="165.0" dy="17">mechanism</tspan></text>
<rect x="365" y="145" width="210" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="470.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="470.0" dy="0">Application process</tspan></text>
<rect x="665" y="95" width="235" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="782.5" y="122.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="782.5" dy="0">Database named</tspan><tspan x="782.5" dy="17">volume</tspan></text>
<rect x="665" y="215" width="235" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="782.5" y="242.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="782.5" dy="0">Tested backup and</tspan><tspan x="782.5" dy="17">restore</tspan></text>
<text x="690" y="185" fill="#526579" font-family="Arial,sans-serif" font-size="14">Persistence path</text>
</svg>