<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Readiness and health checks</title>
<desc id="desc">Startup ordering is not readiness: health indicates the needed capability, and the application retries with a bound before proceeding.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Readiness and health checks</text>
<path d="M184.5 186 L214.5 186" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M369.5 186 L399.5 186" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M554.5 186 L584.5 186" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="37.5" y="155" width="145" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="110.0" y="182.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="110.0" dy="0">Database process</tspan><tspan x="110.0" dy="17">starts</tspan></text>
<rect x="222.5" y="155" width="145" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="295.0" y="182.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="295.0" dy="0">Meaningful health</tspan><tspan x="295.0" dy="17">check</tspan></text>
<rect x="407.5" y="155" width="145" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="480.0" y="191.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="480.0" dy="0">Bounded app retries</tspan></text>
<rect x="592.5" y="155" width="145" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="665.0" y="191.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="665.0" dy="0">Proceed when ready</tspan></text>
</svg>