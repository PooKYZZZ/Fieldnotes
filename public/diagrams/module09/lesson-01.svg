<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Compose services and service discovery</title>
<desc id="desc">A host request reaches a published proxy and API over the private Compose network; the API resolves the database by service name. The database uses a named volume for persistent files.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Compose services and service discovery</text>
<path d="M214 151 L236 151" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M420 151 L442 151" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M626 151 L648 151" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M744 182 L744 238" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="38" y="120" width="176" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="126.0" y="156.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="126.0" dy="0">Host user</tspan></text>
<rect x="244" y="120" width="176" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="332.0" y="156.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="332.0" dy="0">Published proxy port</tspan></text>
<rect x="450" y="120" width="176" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="538.0" y="147.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="538.0" dy="0">API on private</tspan><tspan x="538.0" dy="17">network</tspan></text>
<rect x="656" y="120" width="176" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="744.0" y="156.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="744.0" dy="0">Database at db:5432</tspan></text>
<rect x="656" y="246" width="176" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="744.0" y="273.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="744.0" dy="0">Named volume stores</tspan><tspan x="744.0" dy="17">database files</tspan></text>
<text x="770" y="220" fill="#526579" font-family="Arial,sans-serif" font-size="14">Persistence</text>
</svg>