<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 335" role="img" aria-labelledby="title desc">
  <title id="title">Simplified file read across the system-call boundary</title>
  <desc id="desc">Application code requests a library read using a file descriptor. A system call enters the kernel, which checks permissions and consults filesystem and cache; storage is accessed only if needed. Data or an error returns to the application.</desc>
  <metadata>Original Fieldnotes instructional diagram, created for Module 01. No external assets.</metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#52746d"/></marker></defs>
  <rect width="920" height="335" rx="18" fill="#f5f8f6"/>
  <rect x="35" y="36" width="850" height="103" rx="14" fill="#eaf2ee" stroke="#8ba99d" stroke-width="2"/><text x="62" y="67" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#29494a">USER SPACE</text>
  <rect x="70" y="84" width="270" height="40" rx="8" fill="#fff" stroke="#9eb8b0"/><text x="205" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#29494a">Application + library · read(fd, …)</text>
  <rect x="580" y="36" width="305" height="103" rx="14" fill="#edf3f7" stroke="#92a9b5" stroke-width="2"/><text x="606" y="67" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#29494a">KERNEL SPACE</text>
  <rect x="615" y="84" width="235" height="40" rx="8" fill="#fff" stroke="#92a9b5"/><text x="732" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#29494a">system-call entry · check request</text>
  <path d="M340 104h230" stroke="#52746d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52746d">request</text>
  <path d="M580 124H350" stroke="#52746d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="465" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#52746d">data or error returns</text>
  <rect x="178" y="198" width="250" height="82" rx="12" fill="#fff" stroke="#9eb8b0" stroke-width="2"/><text x="303" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#29494a">Filesystem + cache</text><text x="303" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#536a68">use open descriptor · check access</text>
  <rect x="535" y="198" width="250" height="82" rx="12" fill="#fff" stroke="#9eb8b0" stroke-width="2"/><text x="660" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#29494a">Storage device</text><text x="660" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#536a68">read only if data is not cached</text>
  <path d="M660 125v55H430v22" fill="none" stroke="#52746d" stroke-width="2" marker-end="url(#arrow)"/><path d="M428 239h101" stroke="#52746d" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 260H435" stroke="#879a94" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="460" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#637774">Simplified path: exact calls and device activity depend on the filesystem and cache state.</text>
</svg>
