<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 245" role="img" aria-labelledby="title desc">
  <title id="title">From program file to scheduled process</title>
  <desc id="desc">A shell asks the kernel to create a child process; exec loads a program into that process; a runnable thread waits for scheduler time on a CPU.</desc>
  <metadata>Original Fieldnotes instructional diagram, created for Module 01. No external assets.</metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#52746d"/></marker></defs>
  <rect width="920" height="245" rx="18" fill="#f5f8f6"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="28" y="76" width="170" height="96" rx="12" fill="#fff" stroke="#9eb8b0" stroke-width="2"/><text x="113" y="111" font-size="16" font-weight="700" fill="#29494a">Program file</text><text x="113" y="139" font-size="13" fill="#536a68">instructions + data</text><text x="113" y="158" font-size="12" fill="#647774">on persistent storage</text>
    <rect x="260" y="76" width="170" height="96" rx="12" fill="#e8f1ed" stroke="#7d9f94" stroke-width="2"/><text x="345" y="111" font-size="16" font-weight="700" fill="#29494a">Shell / launcher</text><text x="345" y="139" font-size="13" fill="#536a68">requests a child</text><text x="345" y="158" font-size="12" fill="#647774">process creation</text>
    <rect x="492" y="76" width="170" height="96" rx="12" fill="#fff" stroke="#9eb8b0" stroke-width="2"/><text x="577" y="111" font-size="16" font-weight="700" fill="#29494a">Process + thread</text><text x="577" y="139" font-size="13" fill="#536a68">PID · address space</text><text x="577" y="158" font-size="12" fill="#647774">exec loads program</text>
    <rect x="724" y="76" width="168" height="96" rx="12" fill="#eaf0f4" stroke="#92a9b5" stroke-width="2"/><text x="808" y="111" font-size="16" font-weight="700" fill="#29494a">CPU</text><text x="808" y="139" font-size="13" fill="#536a68">scheduler runs a</text><text x="808" y="158" font-size="13" fill="#536a68">runnable thread</text>
    <path d="M199 124h55M431 124h55M663 124h55" stroke="#52746d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="222" y="105" font-size="11" fill="#52746d">launch</text><text x="454" y="105" font-size="11" fill="#52746d">exec</text><text x="686" y="105" font-size="11" fill="#52746d">when scheduled</text>
    <text x="460" y="215" font-size="12" fill="#637774">A process can remain alive while its thread waits or is not scheduled.</text>
  </g>
</svg>
