<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Build inputs and dependency review</title>
  <desc id="desc">Source, dependencies, base images, toolchains, and workflow definitions all contribute inputs to a build.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#39776f"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c7d9b"/></marker></defs>
  <rect width="960" height="420" rx="20" fill="#f4f8f6"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#29494a">Build inputs and dependency review</text>
  <path d="M135 187 L420 265" fill="none" stroke="#4c7d9b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <path d="M370 187 L450 265" fill="none" stroke="#4c7d9b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <path d="M605 187 L500 265" fill="none" stroke="#4c7d9b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <path d="M832 187 L540 265" fill="none" stroke="#4c7d9b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
  <rect x="35" y="95" width="200" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="135" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="135" dy="0">Source</tspan>
  </text>
  <text x="135" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">application code</text>
  <rect x="270" y="95" width="200" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="370" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="370" dy="0">Dependencies</tspan>
  </text>
  <text x="370" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">locked versions</text>
  <rect x="505" y="95" width="200" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="605" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="605" dy="0">Base + tools</tspan>
  </text>
  <text x="605" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">images, compiler</text>
  <rect x="740" y="95" width="185" height="92" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="832" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="832" dy="0">Workflow</tspan>
  </text>
  <text x="832" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">actions + config</text>
  <rect x="355" y="265" width="250" height="82" rx="14" fill="#eaf2ee" stroke="#9db8ae" stroke-width="2"/>
  <text x="480" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29494a">
  <tspan x="480" dy="0">Build artifact</tspan>
  </text>
  <text x="480" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#526669">reviewed inputs</text>
  <text x="32" y="392" font-family="Arial,sans-serif" font-size="14" fill="#41595f">Pinning improves repeatability; updates still need review and testing.</text>
  </svg>