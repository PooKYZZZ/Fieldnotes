<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">How Terraform uses configuration, state and provider observations</title>
  <desc id="description">Terraform combines desired configuration, protected state and observations from a provider to produce a plan. A person reviews the proposed creates, updates and destroys before apply changes remote resources and updates state. A plan is a preview, not a reservation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#39776f"/></marker></defs>
  <rect width="1000" height="540" rx="18" fill="#f4f8f6"/>
  <text x="34" y="42" fill="#29494a" font-family="Arial,sans-serif" font-size="23" font-weight="700">A plan is a proposal based on a moment in time</text>
  <text x="34" y="68" fill="#5c7371" font-family="Arial,sans-serif" font-size="15">Review consequences and target workspace immediately before making infrastructure changes.</text>

  <rect x="34" y="115" width="232" height="82" rx="12" fill="#fff" stroke="#9abbb1" stroke-width="2"/>
  <text x="54" y="146" fill="#315e58" font-family="Arial,sans-serif" font-size="15" font-weight="700">Desired configuration</text>
  <text x="54" y="174" fill="#5c7371" font-family="Arial,sans-serif" font-size="13">resources + relationships</text>
  <rect x="34" y="217" width="232" height="82" rx="12" fill="#fff" stroke="#c4b79f" stroke-width="2"/>
  <text x="54" y="248" fill="#725b3b" font-family="Arial,sans-serif" font-size="15" font-weight="700">Protected state</text>
  <text x="54" y="276" fill="#766851" font-family="Arial,sans-serif" font-size="13">address ↔ remote object ID</text>
  <rect x="34" y="319" width="232" height="82" rx="12" fill="#fff" stroke="#bdc9d1" stroke-width="2"/>
  <text x="54" y="350" fill="#536c7c" font-family="Arial,sans-serif" font-size="15" font-weight="700">Provider observations</text>
  <text x="54" y="378" fill="#64747c" font-family="Arial,sans-serif" font-size="13">current remote attributes</text>

  <path d="M266 156h80M266 258h80M266 360h80" fill="none" stroke="#82928f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="353" y="204" width="192" height="115" rx="15" fill="#e8f1ed" stroke="#84a69a" stroke-width="2"/>
  <text x="389" y="244" fill="#315e58" font-family="Arial,sans-serif" font-size="18" font-weight="700">terraform plan</text>
  <text x="379" y="273" fill="#536c67" font-family="Arial,sans-serif" font-size="13">calculates proposed actions</text>
  <text x="382" y="296" fill="#536c67" font-family="Arial,sans-serif" font-size="12">state can contain secrets</text>

  <path d="M545 262h63" fill="none" stroke="#39776f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="616" y="184" width="173" height="155" rx="15" fill="#fff" stroke="#95b6a9" stroke-width="2"/>
  <text x="638" y="217" fill="#315e58" font-family="Arial,sans-serif" font-size="16" font-weight="700">Human review</text>
  <text x="638" y="251" fill="#4f6264" font-family="Arial,sans-serif" font-size="13">create · update</text>
  <text x="638" y="275" fill="#6b5141" font-family="Arial,sans-serif" font-size="13">destroy · data impact</text>
  <text x="638" y="310" fill="#607573" font-family="Arial,sans-serif" font-size="12">stop if target is wrong</text>

  <path d="M789 262h48" fill="none" stroke="#39776f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="844" y="184" width="126" height="155" rx="15" fill="#edf1f5" stroke="#bdc9d1" stroke-width="2"/>
  <text x="862" y="217" fill="#536c7c" font-family="Arial,sans-serif" font-size="15" font-weight="700">Apply</text>
  <text x="861" y="250" fill="#5c6e78" font-family="Arial,sans-serif" font-size="12">provider API</text>
  <text x="861" y="273" fill="#5c6e78" font-family="Arial,sans-serif" font-size="12">remote changes</text>
  <text x="861" y="307" fill="#5c6e78" font-family="Arial,sans-serif" font-size="11">state updates</text>

  <path d="M906 339v71H150v-6" fill="none" stroke="#82928f" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="422" y="433" fill="#607573" font-family="Arial,sans-serif" font-size="12">new remote state and state record feed the next plan</text>
  <rect x="34" y="463" width="936" height="52" rx="11" fill="#fff6e8" stroke="#e2d0b4"/>
  <text x="55" y="495" fill="#75583a" font-family="Arial,sans-serif" font-size="14" font-weight="700">Plan is a preview, not a reservation: external changes can happen before apply.</text>
</svg>
