<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Desired configuration and plans</title>
<desc id="desc">Terraform derives a proposed plan from desired configuration, recorded state, and provider observations. Review proposed actions before applying.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Desired configuration and plans</text>
<path d="M260 141 L302 174" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M260 236 L302 198" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M515 186 L557 186" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M725 186 L767 186" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="110" width="205" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="157.5" y="137.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="157.5" dy="0">Desired</tspan><tspan x="157.5" dy="17">configuration</tspan></text>
<rect x="55" y="205" width="205" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="157.5" y="232.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="157.5" dy="0">Protected Terraform</tspan><tspan x="157.5" dy="17">state</tspan></text>
<rect x="310" y="155" width="205" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="412.5" y="182.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="412.5" dy="0">Provider</tspan><tspan x="412.5" dy="17">observations</tspan></text>
<rect x="565" y="155" width="160" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="645.0" y="191.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="645.0" dy="0">Proposed plan</tspan></text>
<rect x="775" y="155" width="145" height="62" rx="14" fill="#f2e8cf" stroke="#7794ad" stroke-width="2"/>
<text x="847.5" y="191.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="847.5" dy="0">Review, then apply</tspan></text>
</svg>