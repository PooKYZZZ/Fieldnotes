<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Safe release and compatibility</title>
<desc id="desc">Diagram showing Add compatible field, then Support both shapes, then Migrate usage, then Remove old field, then Check side effects.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="48" y="64" fill="#15324b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Safe release and compatibility</text>
<path d="M 167 190 H 230" stroke="#6586a3" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 351 190 H 414" stroke="#6586a3" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 535 190 H 598" stroke="#6586a3" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 719 190 H 782" stroke="#6586a3" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="42" y="160" width="140" height="58" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="112" y="195" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600">Add compatible field</text>
<rect x="226" y="215" width="140" height="58" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="296" y="250" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600">Support both shapes</text>
<rect x="410" y="160" width="140" height="58" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="480" y="195" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600">Migrate usage</text>
<rect x="594" y="215" width="140" height="58" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="664" y="250" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600">Remove old field</text>
<rect x="778" y="160" width="140" height="58" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="848" y="195" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600">Check side effects</text>
</svg>