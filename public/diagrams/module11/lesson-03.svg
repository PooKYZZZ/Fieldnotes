<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Smoke tests and rollback</title>
<desc id="desc">Deploy, exercise a meaningful user path, then keep the release if checks pass or restore and verify the known-good artifact if they fail.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Smoke tests and rollback</text>
<path d="M240 181 L277 181" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M465 181 L502 181" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M690 165 L727 116" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M690 198 L727 260" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="150" width="180" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="150.0" y="186.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="150.0" dy="0">Deploy version</tspan></text>
<rect x="285" y="150" width="180" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="375.0" y="186.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="375.0" dy="0">Smoke test user path</tspan></text>
<rect x="510" y="150" width="180" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="600.0" y="186.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="600.0" dy="0">Smoke passes?</tspan></text>
<rect x="735" y="85" width="185" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="827.5" y="121.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="827.5" dy="0">Keep release</tspan></text>
<rect x="735" y="230" width="185" height="62" rx="14" fill="#f4e0df" stroke="#7794ad" stroke-width="2"/>
<text x="827.5" y="257.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="827.5" dy="0">Restore prior</tspan><tspan x="827.5" dy="17">version and verify</tspan></text>
<text x="700" y="126" fill="#526579" font-family="Arial,sans-serif" font-size="14">Pass</text>
<text x="700" y="224" fill="#526579" font-family="Arial,sans-serif" font-size="14">Fail</text>
</svg>