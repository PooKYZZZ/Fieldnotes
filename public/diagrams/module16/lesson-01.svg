<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Logs and request context</title>
<desc id="desc">A request produces structured event records with an opaque identifier that helps correlate related events across services. Keep secrets and personal data out of logged fields.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Logs and request context</text>
<path d="M245 176 L277 176" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M475 176 L507 176" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M705 176 L737 176" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="145" width="190" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="150.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="150.0" dy="0">Request event</tspan></text>
<rect x="285" y="145" width="190" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="380.0" y="172.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="380.0" dy="0">Structured log</tspan><tspan x="380.0" dy="17">fields</tspan></text>
<rect x="515" y="145" width="190" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="610.0" y="181.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="610.0" dy="0">Opaque request ID</tspan></text>
<rect x="745" y="145" width="170" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="830.0" y="172.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="830.0" dy="0">Correlate service</tspan><tspan x="830.0" dy="17">events</tspan></text>
<text x="55" y="270" fill="#526579" font-family="Arial,sans-serif" font-size="14">Logging rule: exclude passwords, tokens, and sensitive request data.</text>
</svg>