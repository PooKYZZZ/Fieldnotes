<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-labelledby="title desc">
  <title id="title">Spans on a shared request timeline</title>
  <desc id="desc">A 180 millisecond gateway request contains a 145 millisecond database service span and a 50 millisecond cache span. The two child spans overlap.</desc>
  <rect width="660" height="270" rx="18" fill="#f4f7fb"/>
  <g font-family="Arial,sans-serif" fill="#173650">
    <text x="24" y="34" font-size="22" font-weight="700">One request, three spans</text>
    <text x="600" y="60" text-anchor="end" font-size="14">elapsed time</text>
    <g text-anchor="middle" font-size="14">
      <text x="200" y="82">0 ms</text><text x="300" y="82">45</text><text x="400" y="82">90</text>
      <text x="500" y="82">135</text><text x="600" y="82">180 ms</text>
    </g>
    <path d="M200 89V240 M300 89V240 M400 89V240 M500 89V240 M600 89V240" stroke="#a8b9ca" stroke-width="1"/>
    <g font-size="17" font-weight="700">
      <text x="24" y="123">Gateway request</text>
      <text x="44" y="177">Database service</text>
      <text x="44" y="231">Cache</text>
    </g>
    <path d="M30 132V226H40 M30 172H40" fill="none" stroke="#7e9ab4" stroke-width="2"/>
    <rect x="200" y="102" width="400" height="33" rx="6" fill="#d5e9f9" stroke="#7399bc"/>
    <rect x="244.4" y="156" width="322.3" height="33" rx="6" fill="#d8ece3" stroke="#759e8e"/>
    <rect x="255.6" y="210" width="111.1" height="33" rx="6" fill="#f4e8ce" stroke="#a99465"/>
    <g text-anchor="middle" font-size="15" font-weight="700">
      <text x="400" y="124">180 ms</text>
      <text x="406" y="178">145 ms</text>
      <text x="311" y="232">50 ms</text>
    </g>
  </g>
</svg>
