<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" role="img" aria-labelledby="title desc"><title id="title">Identity, authentication, and authorization</title><desc id="desc">A four-step diagram: principal; authentication; authorization; scoped permission.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536f8a"/></marker></defs><rect width="940" height="270" rx="20" fill="#fbfdff"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142b45">Identity, authentication, and authorization</text><path d="M 220 136 H 248" stroke="#536f8a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 450 136 H 478" stroke="#536f8a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 680 136 H 708" stroke="#536f8a" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="30" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="125" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">principal</text></g><g><rect x="260" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="355" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">authentication</text></g><g><rect x="490" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="585" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">authorization</text></g><g><rect x="720" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="815" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">scoped permission</text></g><text x="30" y="225" font-family="Arial,sans-serif" font-size="14" fill="#42566c">Authentication establishes identity; authorization decides permitted actions.</text></svg>