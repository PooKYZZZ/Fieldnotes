<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Cloud service models and responsibility</title>
<desc id="desc">IaaS and managed PaaS are alternative service models above provider hardware. The customer and provider responsibilities differ by service.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Cloud service models and responsibility</text>
<path d="M480 143 L255 197" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M480 143 L705 197" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M255 279 L400 294" fill="none" stroke="#6586a3" stroke-width="3"/>
<path d="M705 279 L560 294" fill="none" stroke="#6586a3" stroke-width="3"/>
<rect x="330" y="85" width="300" height="58" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="480.0" y="110.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="480.0" dy="0">Provider operates</tspan><tspan x="480.0" dy="17">physical hardware</tspan></text>
<rect x="85" y="205" width="340" height="74" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="255.0" y="230.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="255.0" dy="0">IaaS: customer</tspan><tspan x="255.0" dy="17">patches guest OS and</tspan><tspan x="255.0" dy="17">configures it</tspan></text>
<rect x="535" y="205" width="340" height="74" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="705.0" y="230.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="705.0" dy="0">Managed PaaS:</tspan><tspan x="705.0" dy="17">provider operates</tspan><tspan x="705.0" dy="17">more of the platform</tspan></text>
<rect x="270" y="300" width="420" height="42" rx="14" fill="#f2e8cf" stroke="#7794ad" stroke-width="2"/>
<text x="480.0" y="309.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="480.0" dy="0">Responsibility</tspan><tspan x="480.0" dy="17">boundary depends on</tspan><tspan x="480.0" dy="17">the service</tspan></text>
</svg>