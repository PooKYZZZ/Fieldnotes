<rect x="395" y="205" width="170" height="58" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="480.0" y="239.0" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="480.0" dy="0">Network interface</tspan></text>
