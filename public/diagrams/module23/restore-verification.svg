<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Restore and verify a backup safely</title>
  <desc id="desc">Preserve a known-good backup, restore it to a separate target, check database integrity, verify expected records, and test the application read path.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#548078" />
    </marker>
  </defs>
  <rect width="960" height="360" rx="20" fill="#f4f8f6" />
  <text x="36" y="49" fill="#263f45" font-family="Arial, sans-serif" font-size="21" font-weight="700">A restore is a chain of checks</text>
  <text x="36" y="75" fill="#5b7072" font-family="Arial, sans-serif" font-size="14">Keep the source and backup unchanged while testing a separate target.</text>
  <g fill="none" stroke="#548078" stroke-width="3" marker-end="url(#arrow)">
    <path d="M206 184h22" />
    <path d="M390 184h22" />
    <path d="M574 184h22" />
    <path d="M758 184h22" />
  </g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(36 112)">
      <rect width="170" height="145" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <text x="17" y="34" fill="#52746d" font-size="12" font-weight="700">01 · PRESERVE</text>
      <text x="17" y="67" fill="#29494a" font-size="17" font-weight="700">Known-good copy</text>
      <text x="17" y="96" fill="#526669" font-size="13">Record cutoff, size,</text>
      <text x="17" y="115" fill="#526669" font-size="13">and checksum</text>
    </g>
    <g transform="translate(220 112)">
      <rect width="170" height="145" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <text x="17" y="34" fill="#52746d" font-size="12" font-weight="700">02 · RESTORE</text>
      <text x="17" y="67" fill="#29494a" font-size="17" font-weight="700">Separate target</text>
      <text x="17" y="96" fill="#526669" font-size="13">Do not overwrite</text>
      <text x="17" y="115" fill="#526669" font-size="13">the damaged source</text>
    </g>
    <g transform="translate(404 112)">
      <rect width="170" height="145" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <text x="17" y="34" fill="#52746d" font-size="12" font-weight="700">03 · CHECK</text>
      <text x="17" y="67" fill="#29494a" font-size="17" font-weight="700">Integrity</text>
      <text x="17" y="96" fill="#526669" font-size="13">Run database checks</text>
      <text x="17" y="115" fill="#526669" font-size="13">and compare bytes</text>
    </g>
    <g transform="translate(588 112)">
      <rect width="170" height="145" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <text x="17" y="34" fill="#52746d" font-size="12" font-weight="700">04 · VERIFY</text>
      <text x="17" y="67" fill="#29494a" font-size="17" font-weight="700">Expected data</text>
      <text x="17" y="96" fill="#526669" font-size="13">Check known record</text>
      <text x="17" y="115" fill="#526669" font-size="13">IDs and data point</text>
    </g>
    <g transform="translate(772 112)">
      <rect width="152" height="145" rx="14" fill="#e4f1eb" stroke="#b7d3c7" stroke-width="2" />
      <text x="16" y="34" fill="#52746d" font-size="12" font-weight="700">05 · TEST</text>
      <text x="16" y="67" fill="#29494a" font-size="17" font-weight="700">Read path</text>
      <text x="16" y="96" fill="#526669" font-size="13">When in scope,</text>
      <text x="16" y="115" fill="#526669" font-size="13">test the application</text>
    </g>
  </g>
  <rect x="36" y="282" width="888" height="42" rx="10" fill="#f8e9c9" />
  <text x="56" y="308" fill="#725018" font-family="Arial, sans-serif" font-size="14" font-weight="600">A database-only drill cannot establish full service recovery time.</text>
</svg>
