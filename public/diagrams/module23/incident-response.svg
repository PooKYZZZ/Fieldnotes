<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">A bounded incident response path</title>
  <desc id="desc">Observe a signal, assess user impact, contain within approved authority, preserve evidence, then recover and review.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#548078" />
    </marker>
  </defs>
  <rect width="960" height="360" rx="20" fill="#f4f8f6" />
  <text x="36" y="49" fill="#263f45" font-family="Arial, sans-serif" font-size="21" font-weight="700">Move from observations to verified recovery</text>
  <text x="36" y="75" fill="#5b7072" font-family="Arial, sans-serif" font-size="14">Record facts and time before changing the system.</text>
  <g fill="none" stroke="#548078" stroke-width="3" marker-end="url(#arrow)">
    <path d="M202 183h24" />
    <path d="M388 183h24" />
    <path d="M574 183h24" />
    <path d="M760 183h24" />
  </g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(36 115)">
      <rect width="166" height="135" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <circle cx="25" cy="27" r="15" fill="#dcebe5" />
      <text x="25" y="32" fill="#356c63" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="18" y="67" fill="#29494a" font-size="17" font-weight="700">Observe</text>
      <text x="18" y="92" fill="#526669" font-size="13">Signal, time, and</text>
      <text x="18" y="111" fill="#526669" font-size="13">known symptoms</text>
    </g>
    <g transform="translate(222 115)">
      <rect width="166" height="135" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <circle cx="25" cy="27" r="15" fill="#dcebe5" />
      <text x="25" y="32" fill="#356c63" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="18" y="67" fill="#29494a" font-size="17" font-weight="700">Assess impact</text>
      <text x="18" y="92" fill="#526669" font-size="13">Users, services,</text>
      <text x="18" y="111" fill="#526669" font-size="13">and dependencies</text>
    </g>
    <g transform="translate(408 115)">
      <rect width="166" height="135" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <circle cx="25" cy="27" r="15" fill="#f8e9c9" />
      <text x="25" y="32" fill="#8a5b13" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <text x="18" y="67" fill="#29494a" font-size="17" font-weight="700">Contain safely</text>
      <text x="18" y="92" fill="#526669" font-size="13">Use an approved,</text>
      <text x="18" y="111" fill="#526669" font-size="13">bounded action</text>
    </g>
    <g transform="translate(594 115)">
      <rect width="166" height="135" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2" />
      <circle cx="25" cy="27" r="15" fill="#dcebe5" />
      <text x="25" y="32" fill="#356c63" font-size="13" font-weight="700" text-anchor="middle">4</text>
      <text x="18" y="67" fill="#29494a" font-size="17" font-weight="700">Preserve</text>
      <text x="18" y="92" fill="#526669" font-size="13">Logs, checks, and</text>
      <text x="18" y="111" fill="#526669" font-size="13">a clear timeline</text>
    </g>
    <g transform="translate(780 115)">
      <rect width="144" height="135" rx="14" fill="#e4f1eb" stroke="#b7d3c7" stroke-width="2" />
      <circle cx="25" cy="27" r="15" fill="#c5dfd2" />
      <text x="25" y="32" fill="#356c63" font-size="13" font-weight="700" text-anchor="middle">5</text>
      <text x="18" y="67" fill="#29494a" font-size="16" font-weight="700">Recover</text>
      <text x="18" y="92" fill="#526669" font-size="13">Verify behavior;</text>
      <text x="18" y="111" fill="#526669" font-size="13">review the result</text>
    </g>
  </g>
  <rect x="36" y="282" width="888" height="42" rx="10" fill="#e8eef2" />
  <text x="56" y="308" fill="#41595f" font-family="Arial, sans-serif" font-size="14" font-weight="600">Keep confirmed facts, working hypotheses, and actions visibly distinct.</text>
</svg>
