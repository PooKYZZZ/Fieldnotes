<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" role="img" aria-labelledby="title desc"><title id="title">Trace a complete release</title><desc id="desc">A four-step diagram: reviewed commit; CI evidence; artifact + deploy; health + recovery.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536f8a"/></marker></defs><rect width="940" height="270" rx="20" fill="#fbfdff"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142b45">Trace a complete release</text><path d="M 220 136 H 248" stroke="#536f8a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 450 136 H 478" stroke="#536f8a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 680 136 H 708" stroke="#536f8a" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="30" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="125" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">reviewed commit</text></g><g><rect x="260" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="355" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">CI evidence</text></g><g><rect x="490" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="585" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">artifact + deploy</text></g><g><rect x="720" y="92" width="190" height="88" rx="14" fill="#eef5ff" stroke="#315b8a" stroke-width="2"/><text x="815" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#142b45">health + recovery</text></g><text x="30" y="225" font-family="Arial,sans-serif" font-size="14" fill="#42566c">Trace one reviewed change through artifact, deployment, health, and recovery evidence.</text></svg>