<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Check mode and privilege</title>
<desc id="desc">Verify host identity and required privilege, preview only what check mode can model, apply safely, then repeat the run and inspect changed tasks.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Check mode and privilege</text>
<path d="M230 181 L262 181" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M460 181 L492 181" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M690 181 L722 181" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="150" width="190" height="62" rx="14" fill="#f2e8cf" stroke="#7794ad" stroke-width="2"/>
<text x="135.0" y="177.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="135.0" dy="0">Verify SSH host and</tspan><tspan x="135.0" dy="17">needed privilege</tspan></text>
<rect x="270" y="150" width="190" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="365.0" y="177.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="365.0" dy="0">Check and diff where</tspan><tspan x="365.0" dy="17">supported</tspan></text>
<rect x="500" y="150" width="190" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="595.0" y="177.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="595.0" dy="0">Apply on disposable</tspan><tspan x="595.0" dy="17">host</tspan></text>
<rect x="730" y="150" width="190" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="825.0" y="177.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="825.0" dy="0">Repeat and inspect</tspan><tspan x="825.0" dy="17">changes</tspan></text>
</svg>