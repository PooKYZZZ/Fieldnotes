<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Inventory and desired state</title>
<desc id="desc">Inventory and variables select hosts and desired tasks. Ansible modules inspect current state and apply changes needed to converge the host.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6586a3"/></marker></defs>
<rect width="960" height="360" rx="24" fill="#f4f7fb"/>
<text x="40" y="48" fill="#15324b" font-family="Arial,sans-serif" font-size="22" font-weight="700">Inventory and desired state</text>
<path d="M230 176 L262 176" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M455 176 L487 176" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M680 176 L712 176" fill="none" stroke="#6586a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="145" width="185" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="137.5" y="172.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="137.5" dy="0">Inventory and</tspan><tspan x="137.5" dy="17">variables</tspan></text>
<rect x="270" y="145" width="185" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="362.5" y="172.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="362.5" dy="0">Select hosts and</tspan><tspan x="362.5" dy="17">tasks</tspan></text>
<rect x="495" y="145" width="185" height="62" rx="14" fill="#d8eafa" stroke="#7794ad" stroke-width="2"/>
<text x="587.5" y="172.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="587.5" dy="0">Module checks actual</tspan><tspan x="587.5" dy="17">state</tspan></text>
<rect x="720" y="145" width="195" height="62" rx="14" fill="#e4f1e8" stroke="#7794ad" stroke-width="2"/>
<text x="817.5" y="172.5" text-anchor="middle" fill="#173650" font-family="Arial,sans-serif" font-size="13" font-weight="600"><tspan x="817.5" dy="0">Converge to desired</tspan><tspan x="817.5" dy="17">state</tspan></text>
</svg>