services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fieldnotes_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-fieldnotes-disposable-only}
    volumes:
      - lab-data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d fieldnotes_lab"]
      interval: 3s
      timeout: 2s
      retries: 10
  api:
    image: ${LAB_IMAGE:-fieldnotes-status-lab:local}
    build:
      context: .
      args:
        LAB_REVISION: ${LAB_REVISION:-local}
    environment:
      PGHOST: db
      PGDATABASE: fieldnotes_lab
      PGUSER: lab
      PGPASSWORD: ${LAB_DB_PASSWORD:-fieldnotes-disposable-only}
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${LAB_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  lab-data:
