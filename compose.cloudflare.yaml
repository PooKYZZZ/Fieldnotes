# Optional overlay for routing Fieldnotes through the existing CyberTrace Tunnel.
# This overlay only connects the app to the existing Tunnel network; do not add a Cloudflare Access gate.
services:
  app:
    networks:
      default: {}
      cybertrace_tunnel:
        aliases:
          - fieldnotes-lms

networks:
  cybertrace_tunnel:
    external: true
    name: ${FIELDNOTES_TUNNEL_NETWORK:?Set FIELDNOTES_TUNNEL_NETWORK to the existing Cloudflare ingress network}
