# Optional overlay for routing Fieldnotes through the existing CyberTrace Tunnel.
# Create a Cloudflare Access application and allow policy before adding the public route.
services:
  app:
    networks:
      default: {}
      cybertrace_tunnel:
        aliases:
          - fieldnotes-lms

networks:
  cybertrace_tunnel:
    external: true
    name: ${FIELDNOTES_TUNNEL_NETWORK:?Set FIELDNOTES_TUNNEL_NETWORK to the existing Cloudflare ingress network}
